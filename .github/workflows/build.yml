name: Build

on:
  push:
    branches:
      - master
      - rework
  pull_request:
    branches:
      - master
      - rework

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven

      - name: Build and verify
        run: mvn --batch-mode --no-transfer-progress clean verify
